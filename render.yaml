services:
  - type: web
    name: silent-doubt-box
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn doubtbox_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
